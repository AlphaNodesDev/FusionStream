<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Settings</h1>
    <div class="settings-menu">
        <button onclick="showSection('extensions')">Extensions</button>
        <button onclick="showSection('adblocker')">AdBlocker</button>
        <button onclick="showSection('advanced')">Advanced</button>
    </div>
    
    <div id="extensions" class="settings-section">
        <h2>Extensions</h2>
        <p>Manage your browser extensions here.</p>
        <div class="checkbox-group" id="moduleList">
            <!-- Checkboxes for installed modules will be added dynamically -->
        </div>
        <button id="browseExtensions">Browse Extensions</button>
        <div id="availableExtensions" class="extensions-list">
            <!-- Available extensions will be listed here -->
        </div>
    </div>
    <script>
    async function loadModules() {
        try {
            const modules = await window.electron.getModules();
            const listContainer = document.getElementById("moduleList");
            listContainer.innerHTML = "";
    
            for (const [module, enabled] of Object.entries(modules)) {
                const listItem = document.createElement("label");
                listItem.className = "checkbox-label";
                listItem.innerHTML = `
                    <input type="checkbox" data-module="${module}" ${enabled ? "checked" : ""}>
                    ${module}
                `;
                listContainer.appendChild(listItem);
            }
    
            document.querySelectorAll("input[type='checkbox']").forEach(checkbox => {
                checkbox.addEventListener("change", async (event) => {
                    const moduleName = event.target.getAttribute("data-module");
                    const newState = await window.electron.toggleModule(moduleName);
                    event.target.checked = newState; // Update UI based on actual state
                });
            });
        } catch (error) {
            console.error("❌ Error loading modules:", error);
        }
    }

    document.getElementById('browseExtensions').addEventListener('click', async () => {
        const availableExtensions = await fetchAvailableExtensions();
        displayAvailableExtensions(availableExtensions);
    });

    async function fetchAvailableExtensions() {
        try {
            console.log("📡 Fetching available extensions...");
            const response = await fetch('https://api.github.com/repos/AlphaNodesDev/FusionStream/contents/addons');
            const addons = await response.json();

            // Ensure the response is an array
            if (!Array.isArray(addons)) {
                throw new Error("Invalid response format from GitHub API");
            }

            console.log("✅ Extensions fetched from API:", addons);

            // Get installed modules from Electron backend
            const installedModules = await window.electron.getModules();
            console.log("🔎 Installed modules:", installedModules);

            // Ensure installedModules is a valid object
            if (typeof installedModules !== "object" || installedModules === null) {
                throw new Error("Invalid format for installed modules");
            }

            return addons
                .filter(addon => addon.type === "file") // Only include files (ignore directories)
                .map(addon => ({
                    name: addon.name,
                    installed: installedModules.hasOwnProperty(addon.name) // Correct installed check
                }));
        } catch (error) {
            console.error("❌ Error fetching available extensions:", error);
            return [];
        }
    }

    function displayAvailableExtensions(extensions) {
        const container = document.getElementById('availableExtensions');
        container.innerHTML = ''; // Clear previous list

        if (extensions.length === 0) {
            container.innerHTML = "<p>No extensions found.</p>";
            return;
        }

        extensions.forEach(extension => {
            const extensionItem = document.createElement('div');
            extensionItem.className = 'extension-item';
            extensionItem.innerHTML = `
                <span>${extension.name}</span>
                <button onclick="toggleExtension('${extension.name}', ${extension.installed})">
                    ${extension.installed ? 'Uninstall' : 'Install'}
                </button>
            `;
            container.appendChild(extensionItem);
        });
    }
    async function toggleExtension(name, isInstalled) {
    try {
        console.log(`${isInstalled ? "Uninstalling" : "Installing"} extension:`, name);

        if (isInstalled) {
            await window.electron.uninstallModule(name);
        } else {
            const githubUrl = `https://raw.githubusercontent.com/AlphaNodesDev/FusionStream/main/addons/${name}`;
            console.log("📥 Installing from:", githubUrl);
            await window.electron.installModule(name, githubUrl);
        }

        // Refresh installed modules list
        await loadModules();

        // Refresh list after install/uninstall
        const availableExtensions = await fetchAvailableExtensions();
        displayAvailableExtensions(availableExtensions);
    } catch (error) {
        console.error(`❌ Error toggling extension "${name}":`, error);
    }
}


async function installExtension(name, url) {
    if (!url || typeof url !== 'string') {
        console.error(`❌ Invalid URL for ${name}:`, url);
        return;
    }
    
    console.log(`Installing: ${name} from ${url}`);
    await window.electron.installModule(name, url);
    refreshExtensions();
}


async function uninstallExtension(name) {
    console.log(`Uninstalling: ${name}`);
    await window.electron.uninstallModule(name);
    refreshExtensions();
}

    // Debug: Load installed modules at startup
    document.addEventListener("DOMContentLoaded", async () => {
        await loadModules();
        console.log("✅ Extensions page loaded.");
    });
    </script>

    <div id="adblocker" class="settings-section">
        <h2>AdBlocker</h2>
        <p>Enable or disable the AdBlocker.</p>
        <button id="toggleAdBlocker">Toggle AdBlocker</button>
    </div>

    <div id="advanced" class="settings-section">
        <h2>Advanced</h2>
        <p>Advanced settings will be available here.</p>
    </div>

    <script>
        function showSection(section) {
            document.querySelectorAll(".settings-section").forEach(div => {
                div.style.display = "none";
            });
            document.getElementById(section).style.display = "block";
        }

        document.getElementById('toggleAdBlocker').addEventListener('click', async () => {
            const response = await window.electron.toggleAdBlocker();
            alert(response ? "🟢 AdBlocker Enabled" : "🔴 AdBlocker Disabled");
        });

        // Show the default section
        showSection("adblocker");
    </script>
</body>
</html>

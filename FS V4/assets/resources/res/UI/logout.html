<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Logout</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 100px;
      background-color: #111;
      color: #fff;
    }
    .logout-box {
      background: #222;
      padding: 2rem;
      border-radius: 10px;
      display: inline-block;
    }
    button {
      background: #ff5555;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="logout-box">
    <h2>👋 Logged In</h2>
    <p>You are currently logged in.</p>
    <button onclick="logout()">Logout</button>
  </div>

  <script>
    async function logout() {
      await fetch('/logout');
      window.location.href = '/login.html';
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FusionStream</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../../../appearance/styles.css" />
  <link rel="stylesheet" href="../../../appearance/swiper-bundle.min.css" />
  <link rel="shortcut icon" href="../icons/logo2.png" type="image/x-icon" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />

  <style>
    body {
      background-color: #111;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
    }

    #episode-buttons {
      margin-top: 1.5rem;
    }

    #episode-buttons button {
      margin: 6px;
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      background-color: rgba(255,255,255,0.15);
      color: white;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    #episode-buttons button:hover {
      background-color: rgba(255,255,255,0.3);
    }

    .glass-overlay {
      position: absolute;
      top: 20%;
      left: 5%;
      right: 5%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 2rem;
      color: white;
      z-index: 2;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    }

    .play-container {
      position: relative;
      height: 60vh;
      overflow: hidden;
      border-radius: 20px;
    }

    .play-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.5);
      border-radius: 20px;
    }

    .about-movie {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      padding: 1.5rem;
      border-radius: 16px;
      margin-top: 2rem;
      color: white;
    }
  </style>
</head>
<body>

<header>
  <div id="custom-titlebar">
    <div class="title">
      <a href="index.html" class="logo"><span>Fusion</span> Stream</a>
    </div>
    <div id="controls">
      <button id="back">←</button>
      <button id="minimize">_</button>
      <button id="close">×</button>
    </div>
    <script src="./assets/renderer.js"></script>
  </div>

  <div class="nav container">
    <div class="navbar">
      <a href="./index.html" class="nav-link nav-active"><i class='bx bx-home'></i><span>Home</span></a>
      <a href="extentions.html" class="nav-link"><i class='bx bx-extension'></i><span>Extensions</span></a>
      <a href="settings.html" class="nav-link"><i class='bx bx-cog'></i><span>Settings</span></a>
    </div>
  </div>
</header>

<!-- Main Content -->
<div class="play-container container">
  <img id="bg-img" src="play-page/play-background.jpg" alt="play image background" class="play-img">
  <div class="glass-overlay">
    <h2 id="movie-title">Title Loading...</h2>
    <p id="movie-description">Description loading...</p>
  </div>
</div>

<!-- Episode Buttons -->
<div class="container" id="episode-buttons"><p>Loading episodes...</p></div>

<!-- About Section (optional) -->
<div class="about-movie container" hidden>
  <h2 id="about-title" hidden>Title Loading...</h2>
</div>

<!-- Script (from first HTML) -->
<script>
  async function loadInfo() {
    const urlParams = new URLSearchParams(window.location.search);
    const provider = urlParams.get("provider");
    const id = urlParams.get("id");

    if (!provider || !id) {
      document.getElementById("movie-title").innerText = "Invalid parameters.";
      return;
    }

    try {
      const res = await fetch(`http://localhost:3000/info?provider=${provider}&id=${encodeURIComponent(id)}`);
      const data = await res.json();
      console.log('Fetched Info:', data);

      document.getElementById("bg-img").src = data.image || data.thumbnail || "";
      document.getElementById("movie-title").innerText = data.title || "Untitled";
      document.getElementById("movie-description").innerText = data.synopsis || data.description || "No description.";

      const episodes = data.episodes || [];
      renderEpisodes(episodes, provider);
    } catch (err) {
      console.error(err);
      document.getElementById("episode-buttons").innerHTML = `<p>Failed to load info.</p>`;
    }
  }
  function renderEpisodes(episodes, provider) {
  const container = document.getElementById("episode-buttons");

  if (!Array.isArray(episodes) || episodes.length === 0) {
    container.innerHTML = "<p>No episodes available.</p>";
    return;
  }

  console.log(`Rendering ${episodes.length} episodes`);

  container.innerHTML = ""; // Clear before adding new buttons

  episodes.forEach((ep, index) => {
    const epNum = ep.number || index + 1;
    const rawId = ep.id || ep.url || ep.video || epNum;
    const titleText = ep.title || `Episode ${epNum}`;

    const button = document.createElement("button");
    button.textContent = `Episode ${epNum}`;
    button.dataset.episodeId = rawId;
    button.dataset.title = titleText;
    button.dataset.provider = provider;

    // Log for debug
    console.log(`[Episode ${index + 1}] ID:`, rawId, '| Title:', titleText);

    // Add event listener
    button.addEventListener("click", () => {
      const epId = encodeURIComponent(button.dataset.episodeId);
      const title = encodeURIComponent(button.dataset.title);
      const provider = encodeURIComponent(button.dataset.provider);
      const url = `player.html?episodeId=${epId}&title=${title}&provider=${provider}`;
      window.location.href = url;
    });

    container.appendChild(button);
  });
}

  loadInfo();
</script>

<div class="copyright">

</div>

  <!-- Scripts -->
  <script src="../js/swiper-bundle.min.js"></script>
  <script src="../js/script.js"></script>
  <script src="../js/renderer.js"></script>
 

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anime Player</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #111;
      color: #fff;
    }

    .anime-details {
      margin-bottom: 20px;
    }

    video {
      width: 100%;
      max-width: 900px;
      margin: 20px 0;
      border-radius: 10px;
    }

    .episode-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .episode-card {
      background: #222;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .episode-card:hover {
      background: #444;
    }

    .episode-card.active {
      background-color: #007bff;
      color: #fff;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="anime-details" id="anime-details">
    <h1>Loading...</h1>
  </div>

  <div id="current-episode-title" style="font-size: 1.2em; font-weight: bold; margin-bottom: 10px;"></div>

  <video id="anime-player" controls poster=""></video>

  <div class="episode-list" id="episode-list"></div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script type="module">
    const urlParams = new URLSearchParams(window.location.search);
    const episodeId = urlParams.get('episodeId');
    const animeId = urlParams.get('animeId') || episodeId;

    const provider = localStorage.getItem('selectedProvider') || 'hiAnime';

    let episodeCardMap = {};

    function highlightEpisode(episodeId) {
      Object.values(episodeCardMap).forEach(card => card.classList.remove('active'));
      if (episodeCardMap[episodeId]) {
        episodeCardMap[episodeId].classList.add('active');
      }
    }

    async function playEpisode(epId, { autoplay = true, posterOnly = false } = {}) {
      const video = document.getElementById('anime-player');
      video.innerHTML = '';

      try {
        const card = episodeCardMap[epId];
        document.getElementById('current-episode-title').textContent = card?.textContent || '';

        if (posterOnly) {
          highlightEpisode(epId);
          return;
        }

        let streamUrl = '';
        let subtitles = [];

        if (provider === 'hiAnime') {
          const res = await fetch(`https://consumet.8man.me/anime/zoro/watch?episodeId=${epId}$sub`);
          const data = await res.json();
          streamUrl = data.sources?.[0]?.url;
          subtitles = data.subtitles || [];
        } else if (provider === 'Kisskh') {
          const res = await fetch(`https://kisskh.co/api/DramaList/Episode/${epId}.json`);
          const data = await res.json();
          streamUrl = data?.Video?.Source;
          // Kisskh subtitles parsing can be added if needed
        } else 
        if (provider === 'multiMovies') {
          console.log('🎬 Playing episode ID:', epId);

          const backendUrl = `http://localhost:3000/multimovies/stream?episodeUrl=${encodeURIComponent(epId)}`;

  const res = await fetch(backendUrl);
  const data = await res.json();

  streamUrl = data?.link;
  subtitles = data?.subtitles || [];
}


        if (!streamUrl) throw new Error('Stream not found.');

        subtitles.forEach(sub => {
          if (!sub.url || sub.lang === 'thumbnails') return;
          const track = document.createElement('track');
          track.kind = 'subtitles';
          track.label = sub.lang;
          track.srclang = sub.lang.slice(0, 2).toLowerCase();
          track.src = sub.url;
          track.default = sub.lang.toLowerCase().includes('english');
          video.appendChild(track);
        });

        if (Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(streamUrl);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            if (autoplay) video.play();
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = streamUrl;
          if (autoplay) {
            video.addEventListener('loadedmetadata', () => video.play());
          }
        } else {
          alert('HLS not supported');
        }

        highlightEpisode(epId);
      } catch (err) {
        console.error('Playback error:', err);
      }
    }

    async function fetchAnimeDetails(animeId) {
      const detailsContainer = document.getElementById('anime-details');
      const list = document.getElementById('episode-list');
      list.innerHTML = '';

      try {
  let anime;

  if (provider === 'hiAnime') {
    const res = await fetch(`https://consumet.8man.me/anime/zoro/info?id=${animeId}`);
    anime = await res.json();
  } else if (provider === 'Kisskh') {
    const res = await fetch(`https://kisskh.ovh/api/DramaList/Drama/${animeId}`);
    anime = await res.json();
  } else if (provider === 'multiMovies') {
  const title = urlParams.get('title') || 'Unknown Title';
  const res = await fetch(`http://localhost:3000/multimovies/episodes?url=${encodeURIComponent(animeId)}`);
  anime = await res.json();
}


  detailsContainer.innerHTML = `<h1>${anime.title}</h1>`;


  if (!Array.isArray(anime.episodes) || anime.episodes.length === 0) {
  // For single movies
  playEpisode(animeId, { autoplay: true });
} else {
  anime.episodes.forEach(ep => {
    const epNum = ep.number || ep.episode || 'N/A';
    const epId = ep.id;
    const card = document.createElement('div');
    card.className = 'episode-card';
    card.textContent = `Episode ${epNum}`;
    card.onclick = () => playEpisode(epId, { autoplay: true });
    list.appendChild(card);
    episodeCardMap[epId] = card;
  });

  const firstEpisodeId = anime.episodes?.[0]?.id;
  if (episodeId && episodeCardMap[episodeId]) {
    playEpisode(episodeId, { autoplay: true });
  } else if (firstEpisodeId) {
    playEpisode(firstEpisodeId, { autoplay: false });
  }
}


      } catch (err) {
        detailsContainer.innerHTML = '<h1>Failed to load anime info.</h1>';
        console.error(err);
      }
    }

    if (animeId) {
  fetchAnimeDetails(animeId);
}
 else {
      document.getElementById('anime-details').innerHTML = '<h1>Error: No Episode ID provided.</h1>';
    }
  </script>
</body>
</html>
